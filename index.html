<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fonts are self-hosted (see src/fonts.css) rather than loaded from the
      Google Fonts CDN, which put two render-blocking third-party origins in the
      critical path. The preload links for the hero image and the Latin font are
      injected at build time by the `inject-preloads` plugin in vite.config.ts,
      because their filenames are content-hashed and cannot be written here.
    -->
    <title>GymGear | Premium Lifting Gear</title>
    <meta
      name="description"
      content="Premium lifting belts, straps, knee sleeves and wrist wraps for athletes who demand the best. Browse the full range and read real reviews."
    />

    <!--
      Social preview tags. These are static on purpose: this is a client-rendered
      SPA, and social crawlers (Facebook, LinkedIn, Slack, Discord, X) do not run
      JavaScript: they only ever see what is in this file. Per-route tags are set
      at runtime by useDocumentMeta, which reaches Googlebot but not crawlers, so
      every shared link previews as the site, not the individual page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymGear" />
    <meta property="og:title" content="GymGear | Premium Lifting Gear" />
    <meta
      property="og:description"
      content="Premium lifting belts, straps, knee sleeves and wrist wraps for athletes who demand the best. Browse the full range and read real reviews."
    />
    <meta property="og:url" content="https://gym-app-7y5y.vercel.app/" />
    <meta
      property="og:image"
      content="https://gym-app-7y5y.vercel.app/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A lifter squatting a loaded barbell in a gym"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ka_GE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GymGear | Premium Lifting Gear" />
    <meta
      name="twitter:description"
      content="Premium lifting belts, straps, knee sleeves and wrist wraps for athletes who demand the best. Browse the full range and read real reviews."
    />
    <meta
      name="twitter:image"
      content="https://gym-app-7y5y.vercel.app/og-image.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
