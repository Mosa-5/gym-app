version: 2
updates:
  # App dependencies (Dependabot uses the "npm" ecosystem for yarn too).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all non-major updates to cut review noise; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions versions used in workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
